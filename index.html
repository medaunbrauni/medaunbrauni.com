<style>
  @font-face { font-family: Medaunbrauni; src: url(fonts/medaunbrauni.otf); font-display: swap; }
  @font-face { font-family: Medaunbrauni; src: url(fonts/medaunbrauni-bold.otf); font-weight: bold; font-display: swap; }

  /* Registradas como <color> para que el cambio de paleta se interpole también dentro de los degradados */
  @property --panel { syntax: '<color>'; inherits: true; initial-value: #e1aa23; }
  @property --accent { syntax: '<color>'; inherits: true; initial-value: #403005; }
  @property --wp { syntax: '<length>'; inherits: false; initial-value: 0px; }
  @property --wx { syntax: '<length-percentage>'; inherits: false; initial-value: 50%; }
  @property --wy { syntax: '<length-percentage>'; inherits: false; initial-value: 30%; }
  :root { --panel: #e1aa23; --accent: #403005; --fade: 2.5s;
          transition: --panel var(--fade) ease-in-out, --accent var(--fade) ease-in-out; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #1a1410; font-family: Medaunbrauni, system-ui, sans-serif; color: var(--accent);
         overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 12px; padding: 16px; }

  /* Fondo: dos capas que se alternan con fundido; escala siempre > 1 para no mostrar bordes */
  .bg { position: fixed; inset: 0; overflow: hidden; }
  .bg div { position: absolute; inset: 0; background: center / cover no-repeat;
            opacity: 0; transition: opacity var(--fade) ease-in-out;
            animation: kenburns 40s ease-in-out infinite alternate; will-change: transform; }
  .bg div.on { opacity: 1; }
  @keyframes kenburns {
    from { transform: scale(1.05) translate(0, 0); }
    to   { transform: scale(1.15) translate(-1.5%, -1%); }
  }

  main { position: relative; width: min(420px, 100%); max-height: calc(100vh - 32px - 12px - 3em); overflow-y: auto;
         padding: clamp(24px, 5vh, 40px) 28px; border-radius: 22px; text-align: center;
         /* Ola radial de opacidad (50% a 85%, curva seno, 780px por ciclo) que sale de --wx/--wy: el cursor o el
            último toque. --wp (avance de los anillos) lo mueve el script. */
         --wx: 50%; --wy: 30%;
         background: repeating-radial-gradient(circle at var(--wx) var(--wy),
           color-mix(in srgb, var(--panel) 50.0%, transparent) var(--wp),
           color-mix(in srgb, var(--panel) 52.3%, transparent) calc(var(--wp) + 65px),
           color-mix(in srgb, var(--panel) 58.8%, transparent) calc(var(--wp) + 130px),
           color-mix(in srgb, var(--panel) 67.5%, transparent) calc(var(--wp) + 195px),
           color-mix(in srgb, var(--panel) 76.2%, transparent) calc(var(--wp) + 260px),
           color-mix(in srgb, var(--panel) 82.7%, transparent) calc(var(--wp) + 325px),
           color-mix(in srgb, var(--panel) 85.0%, transparent) calc(var(--wp) + 390px),
           color-mix(in srgb, var(--panel) 82.7%, transparent) calc(var(--wp) + 455px),
           color-mix(in srgb, var(--panel) 76.2%, transparent) calc(var(--wp) + 520px),
           color-mix(in srgb, var(--panel) 67.5%, transparent) calc(var(--wp) + 585px),
           color-mix(in srgb, var(--panel) 58.8%, transparent) calc(var(--wp) + 650px),
           color-mix(in srgb, var(--panel) 52.3%, transparent) calc(var(--wp) + 715px),
           color-mix(in srgb, var(--panel) 50.0%, transparent) calc(var(--wp) + 780px));
         transition: --wx .8s ease-out, --wy .8s ease-out;
         backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
         box-shadow: 0 10px 40px rgb(0 0 0 / .35);
         text-shadow: 0 0 2px var(--panel); }
  main h1 { filter: drop-shadow(0 0 2px var(--panel)); }
  /* Nube difuminada del color del panel detrás de cada texto: la ola baja hasta 50%, pero junto a las
     letras el fondo queda denso y el contraste no depende de dónde caiga el anillo */
  main h1, main h2, .big, .ep { position: relative; isolation: isolate; }
  main h1::before, main h2::before, .big::before, .ep::before {
    content: ""; position: absolute; inset: -2px -14px; z-index: -1; border-radius: 50%;
    background: var(--panel); opacity: .9; filter: blur(14px); }

  .logo { display: block; width: 88%; aspect-ratio: 1000 / 288; margin: 0 auto clamp(20px, 5vh, 40px);
          background: var(--accent);
          -webkit-mask: url(logo.png) center / contain no-repeat; mask: url(logo.png) center / contain no-repeat; }

  a { display: block; color: inherit; text-decoration: none; text-transform: uppercase; letter-spacing: .06em;
      padding: 8px; border-radius: 10px; transition: transform .2s, background-color .2s; }
  a:hover, a:focus-visible { transform: scale(1.06); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  a:focus-visible { outline: 2px solid currentColor; }
  /* Pulso suave: usa `scale` para no chocar con el `transform` del hover */
  .big, .ep { animation: pulse 2.8s ease-in-out infinite; }
  a:nth-of-type(2), a:nth-of-type(4) { animation-delay: .5s; }
  a:nth-of-type(5) { animation-delay: 1s; }
  @keyframes pulse { 50% { scale: 1.035; } }
  .big { display: flex; align-items: center; justify-content: center; gap: .45em; }
  .ico { width: 1.05em; height: 1.05em; flex: none; }
  .big { font-size: clamp(1.3rem, 4.5vw, 1.75rem); font-weight: bold; margin: 6px 0; }
  hr { color: inherit; border: 0; border-top: 2px dashed currentColor; width: 70%; margin: clamp(16px, 4vh, 28px) auto 12px; opacity: .8; }
  h2 { font-size: clamp(1.05rem, 3.6vw, 1.35rem); font-weight: normal; text-transform: uppercase;
       letter-spacing: .06em; margin: 0 0 clamp(12px, 3vh, 24px); line-height: 1.3; }
  .ep { font-size: clamp(1.2rem, 4vw, 1.6rem); font-weight: bold; padding: 4px; }

  /* La fuente no trae acento en la I: se dibuja aquí */
  .i-acute { position: relative; }
  .i-acute::after { content: ""; position: absolute; left: 50%; top: -.22em; width: .09em; height: .24em;
                    background: currentColor; border-radius: .05em; transform: translateX(-10%) rotate(40deg); }

  .clip { display: block; padding: 0; position: relative; aspect-ratio: 16 / 9; margin: 0 0 clamp(12px, 3vh, 20px); border-radius: 12px;
          overflow: hidden; background: color-mix(in srgb, var(--accent) 25%, transparent); }
  .clip iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none;
                 opacity: 0; transition: opacity .8s ease-in-out; }
  .clip iframe.on { opacity: 1; }

  /* Fuente del sistema: la tipografía de la marca no trae é/í */
  footer { position: relative; max-width: 420px; text-align: center; color: #fff; opacity: .7;
           font: 11px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
           text-shadow: 0 1px 2px rgb(0 0 0 / .9), 0 0 8px rgb(0 0 0 / .6); }

  @media (prefers-reduced-motion: reduce) { .bg div { animation: none; transform: scale(1.05); } .big, .ep { animation: none; } }
</style>

<script>
  const layers = document.querySelectorAll('.bg div');
  const root = document.documentElement.style;
  let i = Math.floor(Math.random() * BGS.length), front = 0;

  function show(n) {
    const b = BGS[n], img = new Image();
    img.onload = () => {
      front ^= 1;
      layers[front].style.backgroundImage = `url(${b.src})`;
      layers[front].classList.add('on');
      layers[front ^ 1].classList.remove('on');
      root.setProperty('--panel', b.panel);
      root.setProperty('--accent', b.accent);
    };
    img.src = b.src;
  }

  show(i);
  setInterval(() => show(i = (i + 1) % BGS.length), 60000);

  // Centro de la ola: sigue al mouse; en pantallas táctiles empieza al azar y se mueve solo al tocar
  const panel = document.querySelector('main');
  panel.style.setProperty('--wx', `${Math.round(Math.random() * 100)}%`);
  panel.style.setProperty('--wy', `${Math.round(Math.random() * 100)}%`);
  const waveAt = (x, y) => {
    const r = panel.getBoundingClientRect();
    panel.style.setProperty('--wx', `${Math.round(x - r.left)}px`);
    panel.style.setProperty('--wy', `${Math.round(y - r.top)}px`);
  };
  let pointer = 'mouse';
  addEventListener('pointerdown', e => (pointer = e.pointerType));
  // Velocidad: lenta en reposo; moverse o tocar la acelera y luego vuelve a bajar sola
  const WAVE = 780, CALM = 40, MAX_BOOST = 900;  // px del ciclo, px/s en reposo, px/s extra máximo
  let phase = 0, boost = 0, last = performance.now();
  const kick = v => (boost = Math.min(MAX_BOOST, boost + v));
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    waveAt(e.clientX, e.clientY);
    kick(Math.hypot(e.movementX, e.movementY) * 6);
  });
  addEventListener('click', e => { if (pointer !== 'mouse') waveAt(e.clientX, e.clientY); kick(600); });
  function flow(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    boost *= Math.exp(-dt * 1.8);  // se desacelera en ~2 s
    phase = (phase + (CALM + boost) * dt) % WAVE;
    panel.style.setProperty('--wp', `${phase.toFixed(1)}px`);
    requestAnimationFrame(flow);
  }
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(flow);

  // Clips en bucle: [id de YouTube, segundo inicial, segundo final]
  const CLIPS = [
    ['zVXJ1l-Y-ME', 7, 22],
    ['VYAn6CllAWI', 36, 51],
    ['c6K5AjTGBLc', 21, 36],
  ];
  // Dos reproductores encimados: uno se ve y el otro prepara el siguiente clip.
  // El oculto arranca LEAD segundos antes del inicio del clip (así el título que YouTube pone al empezar
  // ya pasó cuando se muestra) y FADE_AT segundos antes del final del visible se cruzan con un fundido.
  const LEAD = 6, FADE_AT = 0.8;
  const box = document.querySelector('.clip');
  const slots = [];
  let c = 0, act = 0, ready = 0, warm = false;

  const at = n => CLIPS[n % CLIPS.length];
  const from = n => Math.max(0, at(n)[1] - LEAD);
  const clip = n => ({ videoId: at(n)[0], startSeconds: from(n), endSeconds: at(n)[2] });

  function onYouTubeIframeAPIReady() {
    for (const k of [0, 1]) {
      const el = box.appendChild(document.createElement('div'));
      slots[k] = { priming: true, shown: false, p: new YT.Player(el, {
        host: 'https://www.youtube-nocookie.com',
        playerVars: { mute: 1, controls: 0, playsinline: 1, rel: 0, disablekb: 1, iv_load_policy: 3, cc_load_policy: 0 },
        events: {
          onReady: e => { e.target.mute(); if (++ready === 2) start(); },
          onStateChange: e => onState(k, e.data),
        },
      }) };
    }
  }

  function start() {
    slots[act].priming = false;
    slots[act].p.loadVideoById(clip(c));
    prime(act ^ 1, c + 1);
    setInterval(tick, 200);
  }

  function prime(k, n) {
    slots[k].priming = true;
    slots[k].p.loadVideoById(clip(n));
  }

  function reveal(k) {
    slots[k].shown = true;  slots[k].p.getIframe().classList.add('on');
    slots[k ^ 1].shown = false; slots[k ^ 1].p.getIframe().classList.remove('on');
  }

  function onState(k, st) {
    const { p, priming } = slots[k];
    if (st !== YT.PlayerState.PLAYING) return;
    // cc_load_policy: 0 no basta si el usuario tiene subtítulos activados en su cuenta: se descarga el módulo
    p.unloadModule('captions'); p.unloadModule('cc');
    if (priming) { p.pauseVideo(); p.seekTo(from(c + 1), true); }  // queda cargado y en pausa
  }

  function tick() {
    const s = slots[act], [, begin, end] = at(c);
    if (s.p.getPlayerState?.() !== YT.PlayerState.PLAYING) return;
    const t = s.p.getCurrentTime();
    box.href = `https://www.youtube.com/watch?v=${at(c)[0]}&t=${Math.floor(Math.max(t, begin))}s`;  // clic = este video en este segundo
    if (!s.shown && t >= begin) reveal(act);  // solo aplica al primer clip
    if (!warm && t >= end - FADE_AT - LEAD) {  // arranca el siguiente, todavía oculto
      warm = true;
      slots[act ^ 1].priming = false;
      slots[act ^ 1].p.playVideo();
    }
    if (t >= end - FADE_AT) {
      const prev = act;
      act ^= 1; c++; warm = false;
      reveal(act);
      setTimeout(() => prime(prev, c + 1), 1500);  // después del fundido, el que salió prepara el siguiente
    }
  }
</script>
